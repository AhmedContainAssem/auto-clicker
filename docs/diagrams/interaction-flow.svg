<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyan-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <filter id="flow-glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#flow-bg)" rx="16"/>
  <rect width="956" height="476" x="2" y="2" fill="none" stroke="#1d3866" stroke-width="1.5" rx="15"/>

  <!-- Title -->
  <text x="480" y="50" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#00f3ff" text-anchor="middle" letter-spacing="2">
    INTERACTION FLOW &amp; GESTURE MATRIX
  </text>
  <text x="480" y="78" font-family="'Segoe UI', sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    MicroClicker Pro handles mouse gestures and global hardware hotkeys seamlessly
  </text>

  <!-- 4 Flow Cards -->
  <!-- Card 1: Left Click -->
  <g transform="translate(60, 120)">
    <rect width="180" height="260" rx="14" fill="#0c1833" stroke="#00f3ff" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="28" fill="#00f3ff" fill-opacity="0.15" stroke="#00f3ff" stroke-width="2"/>
    <text x="90" y="56" font-family="Consolas, monospace" font-size="20" font-weight="900" fill="#00f3ff" text-anchor="middle">LMB</text>
    
    <text x="90" y="115" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Left Click</text>
    <text x="90" y="145" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Click Badge</text>
    
    <!-- Arrow -->
    <path d="M 90 165 L 90 190 M 85 185 L 90 192 L 95 185" stroke="#00ffaa" stroke-width="2" fill="none"/>

    <rect x="20" y="200" width="140" height="40" rx="8" fill="#00ffaa" fill-opacity="0.15" stroke="#00ffaa" stroke-width="1"/>
    <text x="90" y="225" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#00ffaa" text-anchor="middle">TOGGLE ON / OFF</text>
  </g>

  <!-- Card 2: Drag & Snap -->
  <g transform="translate(280, 120)">
    <rect width="180" height="260" rx="14" fill="#0c1833" stroke="#00ffaa" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="28" fill="#00ffaa" fill-opacity="0.15" stroke="#00ffaa" stroke-width="2"/>
    <text x="90" y="56" font-family="Consolas, monospace" font-size="18" font-weight="900" fill="#00ffaa" text-anchor="middle">DRAG</text>
    
    <text x="90" y="115" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Drag &amp; Release</text>
    <text x="90" y="145" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Reposition anywhere</text>
    
    <!-- Arrow -->
    <path d="M 90 165 L 90 190 M 85 185 L 90 192 L 95 185" stroke="#00f3ff" stroke-width="2" fill="none"/>

    <rect x="20" y="200" width="140" height="40" rx="8" fill="#00f3ff" fill-opacity="0.15" stroke="#00f3ff" stroke-width="1"/>
    <text x="90" y="225" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#00f3ff" text-anchor="middle">MAGNETIC SNAP</text>
  </g>

  <!-- Card 3: Global Hotkey -->
  <g transform="translate(500, 120)">
    <rect width="180" height="260" rx="14" fill="#0c1833" stroke="#ff00ea" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="28" fill="#ff00ea" fill-opacity="0.15" stroke="#ff00ea" stroke-width="2"/>
    <text x="90" y="56" font-family="Consolas, monospace" font-size="20" font-weight="900" fill="#ff00ea" text-anchor="middle">F6</text>
    
    <text x="90" y="115" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Global Hotkey</text>
    <text x="90" y="145" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Works in Fullscreen</text>
    
    <!-- Arrow -->
    <path d="M 90 165 L 90 190 M 85 185 L 90 192 L 95 185" stroke="#ff00ea" stroke-width="2" fill="none"/>

    <rect x="20" y="200" width="140" height="40" rx="8" fill="#ff00ea" fill-opacity="0.15" stroke="#ff00ea" stroke-width="1"/>
    <text x="90" y="225" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#ff00ea" text-anchor="middle">INSTANT ENGAGE</text>
  </g>

  <!-- Card 4: Right Click / Tray Menu -->
  <g transform="translate(720, 120)">
    <rect width="180" height="260" rx="14" fill="#0c1833" stroke="#facc15" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="28" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="2"/>
    <text x="90" y="56" font-family="Consolas, monospace" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">RMB</text>
    
    <text x="90" y="115" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Right Click / Tray</text>
    <text x="90" y="145" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Taskbar Context Menu</text>
    
    <!-- Arrow -->
    <path d="M 90 165 L 90 190 M 85 185 L 90 192 L 95 185" stroke="#facc15" stroke-width="2" fill="none"/>

    <rect x="20" y="200" width="140" height="40" rx="8" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1"/>
    <text x="90" y="225" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#facc15" text-anchor="middle">MENU &amp; SAFE EXIT</text>
  </g>

  <!-- Footer status line -->
  <text x="480" y="430" font-family="Consolas, monospace" font-size="13" fill="#64748b" text-anchor="middle">
    All operations execute concurrently across isolated threads with 0 UI blocking.
  </text>
</svg>
