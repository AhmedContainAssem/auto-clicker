<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="life-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#life-bg)" rx="16"/>
  <rect width="956" height="476" x="2" y="2" fill="none" stroke="#1d3866" stroke-width="1.5" rx="15"/>

  <!-- Title -->
  <text x="480" y="45" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#00f3ff" text-anchor="middle" letter-spacing="2">
    APPLICATION LIFECYCLE &amp; SAFE SHUTDOWN
  </text>
  <text x="480" y="72" font-family="'Segoe UI', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Deterministic bootstrap, high-precision initialization, atomic state transition, and clean resource release
  </text>

  <!-- Horizontal Flow Stages -->
  <!-- Stage 1 -->
  <g transform="translate(40, 120)">
    <rect width="160" height="180" rx="10" fill="#0c1833" stroke="#00f3ff" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="18" fill="#00f3ff" fill-opacity="0.15"/>
    <text x="80" y="40" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#00f3ff" text-anchor="middle">1</text>
    <text x="80" y="80" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Bootstrap</text>
    <text x="80" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">DPI Awareness (2)</text>
    <text x="80" y="128" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">AppUserModelID</text>
    <text x="80" y="146" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Load config.json</text>
  </g>

  <path d="M 205 210 L 225 210" stroke="#00f3ff" stroke-width="2" fill="none"/>

  <!-- Stage 2 -->
  <g transform="translate(230, 120)">
    <rect width="160" height="180" rx="10" fill="#0c1833" stroke="#00ffaa" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="18" fill="#00ffaa" fill-opacity="0.15"/>
    <text x="80" y="40" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#00ffaa" text-anchor="middle">2</text>
    <text x="80" y="80" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Kernel Engine</text>
    <text x="80" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">timeBeginPeriod(1)</text>
    <text x="80" y="128" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Pre-allocate Ctypes</text>
    <text x="80" y="146" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">DirectInput Mapping</text>
  </g>

  <path d="M 395 210 L 415 210" stroke="#00ffaa" stroke-width="2" fill="none"/>

  <!-- Stage 3 -->
  <g transform="translate(420, 120)">
    <rect width="160" height="180" rx="10" fill="#0c1833" stroke="#00f3ff" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="18" fill="#00f3ff" fill-opacity="0.15"/>
    <text x="80" y="40" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#00f3ff" text-anchor="middle">3</text>
    <text x="80" y="80" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">UI &amp; Shell</text>
    <text x="80" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Frameless Alpha HUD</text>
    <text x="80" y="128" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Win32 Tray Icon</text>
    <text x="80" y="146" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Tkinter Mainloop</text>
  </g>

  <path d="M 585 210 L 605 210" stroke="#00f3ff" stroke-width="2" fill="none"/>

  <!-- Stage 4 -->
  <g transform="translate(610, 120)">
    <rect width="160" height="180" rx="10" fill="#0c1833" stroke="#ff00ea" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="18" fill="#ff00ea" fill-opacity="0.15"/>
    <text x="80" y="40" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#ff00ea" text-anchor="middle">4</text>
    <text x="80" y="80" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Runtime Loop</text>
    <text x="80" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">LMB / F6 Toggle</text>
    <text x="80" y="128" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Edge Snap Movement</text>
    <text x="80" y="146" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">SendInput Execution</text>
  </g>

  <path d="M 775 210 L 795 210" stroke="#ff00ea" stroke-width="2" fill="none"/>

  <!-- Stage 5 -->
  <g transform="translate(800, 120)">
    <rect width="120" height="180" rx="10" fill="#0c1833" stroke="#facc15" stroke-width="1.5"/>
    <circle cx="60" cy="35" r="18" fill="#facc15" fill-opacity="0.15"/>
    <text x="60" y="40" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#facc15" text-anchor="middle">5</text>
    <text x="60" y="80" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Clean Exit</text>
    <text x="60" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">timeEndPeriod</text>
    <text x="60" y="128" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">NIM_DELETE</text>
    <text x="60" y="146" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Save Config</text>
  </g>

  <!-- Bottom Callout -->
  <g transform="translate(40, 340)">
    <rect width="880" height="90" rx="10" fill="#060c18" stroke="#1d3866" stroke-width="1.5"/>
    <text x="440" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#00ffaa" text-anchor="middle">
      ZERO RESOURCE LEAKS GUARANTEE
    </text>
    <text x="440" y="58" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
      Closing via RMB or System Tray invokes the destructor pipeline, removing the tray icon, releasing timer resolution, and persisting last used coordinates.
    </text>
  </g>
</svg>
