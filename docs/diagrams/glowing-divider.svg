<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="100%" height="8">
  <defs>
    <linearGradient id="neon-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f3ff" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#ff00ea" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ffaa" stop-opacity="1"/>
      <stop offset="65%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#ff00ea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="line-glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="2" width="1200" height="4" rx="2" fill="url(#neon-glow-line)" filter="url(#line-glow)"/>
</svg>
