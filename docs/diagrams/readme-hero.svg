<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cyan-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffaa"/>
      <stop offset="100%" stop-color="#00f3ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-bolt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" fill="url(#bg-grad)" rx="16"/>
  
  <!-- Subtle Circuit / Grid Lines -->
  <g stroke="#142647" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="480"/>
    <line x1="350" y1="0" x2="350" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="850" y1="0" x2="850" y2="480"/>
    <line x1="1050" y1="0" x2="1050" y2="480"/>
  </g>

  <!-- Outer Border -->
  <rect width="1196" height="476" x="2" y="2" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.35" rx="15"/>

  <!-- Left Side: Interactive HUD Visual -->
  <g transform="translate(80, 90)">
    <!-- Glow Ring -->
    <rect x="-10" y="-10" width="260" height="260" rx="30" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.15" filter="url(#glow-cyan)"/>
    
    <!-- Outer Card -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="#0c1833" stroke="#00f3ff" stroke-width="2" stroke-opacity="0.8"/>
    
    <!-- Corner Accents -->
    <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#00ffaa" stroke-width="3"/>
    <path d="M 228 30 L 228 12 L 210 12" fill="none" stroke="#00ffaa" stroke-width="3"/>
    <path d="M 12 210 L 12 228 L 30 228" fill="none" stroke="#00ffaa" stroke-width="3"/>
    <path d="M 228 210 L 228 228 L 210 228" fill="none" stroke="#00ffaa" stroke-width="3"/>

    <!-- Key Indicator Badge -->
    <rect x="35" y="35" width="170" height="90" rx="14" fill="#081022" stroke="#1d3866" stroke-width="1.5"/>
    <text x="120" y="100" font-family="Consolas, 'Courier New', monospace" font-size="64" font-weight="900" fill="#00f3ff" text-anchor="middle" filter="url(#glow-cyan)">F</text>

    <!-- Status Button (ACTIVE ON) -->
    <rect x="35" y="145" width="170" height="58" rx="12" fill="url(#emerald-glow)"/>
    <text x="120" y="182" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#05141c" text-anchor="middle" letter-spacing="3">ACTIVE</text>
    
    <!-- Floating Tag -->
    <rect x="70" y="255" width="100" height="24" rx="12" fill="#00f3ff" fill-opacity="0.15" stroke="#00f3ff" stroke-width="1"/>
    <text x="120" y="271" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00f3ff" text-anchor="middle">50x50 HUD</text>
  </g>

  <!-- Center-Right: Typography & Value Propositions -->
  <g transform="translate(380, 80)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="15" width="310" height="30" rx="15" fill="#00f3ff" fill-opacity="0.1" stroke="#00f3ff" stroke-width="1"/>
    <circle cx="16" cy="30" r="5" fill="#00ffaa" filter="url(#glow-cyan)"/>
    <text x="32" y="35" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#00f3ff" letter-spacing="1.5">WINDOWS KERNEL-TIMED AUTOMATION</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="'Segoe UI', -apple-system, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Auto<tspan fill="#00f3ff" filter="url(#glow-cyan)">F</tspan>Presser <tspan font-size="36" fill="#00ffaa" font-weight="700">PRO</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="148" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Zero-lag hardware DirectInput &amp; magnetic snap HUD overlay
    </text>

    <!-- 4 Value Pillar Badges -->
    <g transform="translate(0, 185)">
      <!-- Metric 1: DirectInput -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="75" rx="12" fill="#0c1833" stroke="#1d3866" stroke-width="1.5"/>
        <text x="20" y="32" font-family="Consolas, monospace" font-size="18" font-weight="800" fill="#00f3ff">DirectInput</text>
        <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">Hardware Scancodes</text>
      </g>

      <!-- Metric 2: 0ms Timer -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="180" height="75" rx="12" fill="#0c1833" stroke="#1d3866" stroke-width="1.5"/>
        <text x="20" y="32" font-family="Consolas, monospace" font-size="18" font-weight="800" fill="#00ffaa">&lt; 0.05% CPU</text>
        <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">8MB Zero GC Memory</text>
      </g>

      <!-- Metric 3: System Tray -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="180" height="75" rx="12" fill="#0c1833" stroke="#1d3866" stroke-width="1.5"/>
        <text x="20" y="32" font-family="Consolas, monospace" font-size="18" font-weight="800" fill="#ff00ea">Win32 Native</text>
        <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">Tray + Magnetic Edge</text>
      </g>

      <!-- Metric 4: Anti-Cheat Safe -->
      <g transform="translate(585, 0)">
        <rect x="0" y="0" width="180" height="75" rx="12" fill="#0c1833" stroke="#1d3866" stroke-width="1.5"/>
        <text x="20" y="32" font-family="Consolas, monospace" font-size="18" font-weight="800" fill="#facc15">Human Jitter</text>
        <text x="20" y="55" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">Gaussian Distribution</text>
      </g>
    </g>

    <!-- Bottom Feature Callout -->
    <g transform="translate(0, 285)">
      <text x="0" y="18" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#00f3ff">
        [F6 Global Hotkey] <tspan fill="#64748b">|</tspan> [Hold / Rapid / Burst] <tspan fill="#64748b">|</tspan> [Zero External Dependencies]
      </text>
    </g>
  </g>
</svg>
